{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Editar Aluno</h2>
        <p>Atualize os dados do aluno abaixo.</p>
    </div>

    <div class="form-container" style="max-width: 600px; margin: 0 auto;">
        <form method="POST" action="{{ url_for('editar_aluno', aluno_id=aluno.id) }}" novalidate>
            <div class="form-group">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" value="{{ aluno['nome_completo'] }}" required>
            </div>
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" value="{{ aluno['data_nascimento'].strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ aluno['email'] or '' }}" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" value="{{ aluno['telefone'] or '' }}" required>
            </div>

            <div class="form-group">
                <label for="ativo">Status</label>
                <select id="ativo" name="ativo" required>
                    <option value="true" {% if aluno['ativo'] %}selected{% endif %}>Ativo</option>
                    <option value="false" {% if not aluno['ativo'] %}selected{% endif %}>Inativo</option>
                </select>
            </div>

            <div class="form-group-checkbox">
                <input type="checkbox" id="menor_idade" name="menor_idade" {% if aluno['responsavel_id'] %}checked{% endif %}>
                <label for="menor_idade">É menor de idade e necessita de um responsável?</label>
            </div>

            <div id="responsavel-fields" style="display: {% if aluno['responsavel_id'] %}block{% else %}none{% endif %};">
                <hr>
                <h4>Dados do Responsável</h4>
                <div class="form-group">
                    <label for="responsavel_nome">Nome Completo do Responsável</label>
                    <input type="text" id="responsavel_nome" name="responsavel_nome" value="{{ aluno['responsavel_nome'] if aluno['responsavel_id'] else '' }}">
                </div>
                <div class="form-group">
                    <label for="responsavel_telefone">Telefone do Responsável</label>
                    <input type="tel" id="responsavel_telefone" name="responsavel_telefone" value="{{ aluno['responsavel_telefone'] if aluno['responsavel_id'] else '' }}">
                </div>
                <div class="form-group">
                    <label for="responsavel_parentesco">Parentesco</label>
                    <input type="text" id="responsavel_parentesco" name="responsavel_parentesco" value="{{ aluno['responsavel_parentesco'] if aluno['responsavel_id'] else '' }}">
                </div>
            </div>

            <button type="submit" class="btn btn-success" style="margin-top: 1rem;">Atualizar Aluno</button>
        </form>
    </div>
</div>
{% endblock %}
