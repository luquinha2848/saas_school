{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Novo Contrato</h2>
        <p>Preencha os dados abaixo para registrar um novo contrato.</p>
    </div>

    <div class="form-container" style="max-width: 600px; margin: 0 auto;">
        <form method="POST" action="{{ url_for('novo_contrato') }}">
            <div class="form-group">
                <label for="aluno_id">Aluno</label>
                <select id="aluno_id" name="aluno_id" required>
                    <option value="" disabled selected>Selecione um aluno</option>
                    {% for aluno in alunos %}
                        <option value="{{ aluno.id }}">{{ aluno.nome_completo }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="plano_descricao">Descrição do Plano</label>
                <input type="text" id="plano_descricao" name="plano_descricao" required placeholder="Ex: Aulas de Violão - 2x/semana">
            </div>
            <div class="form-group">
                <label for="valor_mensal">Valor Mensal (R$)</label>
                <input type="number" step="0.01" id="valor_mensal" name="valor_mensal" required placeholder="Ex: 250.00">
            </div>
            <div class="form-group">
                <label for="data_inicio">Data de Início</label>
                <input type="date" id="data_inicio" name="data_inicio" required>
            </div>
            <div class="form-group">
                <label for="data_fim">Data de Fim</label>
                <input type="date" id="data_fim" name="data_fim" required>
            </div>

            <button type="submit" class="btn btn-success" style="margin-top: 1rem;">Salvar Contrato</button>
        </form>
    </div>
</div>
{% endblock %}
