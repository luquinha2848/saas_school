{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Editar Aluno</h2>
        <p>Atualize as informações do aluno abaixo.</p>
    </div>

    <div class="form-container" style="max-width: 600px; margin: 0 auto;">
        <form action="{{ url_for('edit_aluno', aluno_id=aluno.id) }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" value="{{ aluno.nome }}" required>
            </div>
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" value="{{ aluno.data_nascimento.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ aluno.email }}">
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" value="{{ aluno.telefone }}">
            </div>
            <div style="text-align: right;">
                <a href="{{ url_for('alunos') }}" class="btn" style="background-color: #6c757d; color: white;">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
